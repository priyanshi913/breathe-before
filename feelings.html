<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breathe Before - How do you feel?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-bg">

  <div class="logo logo-left">🌿 Breathe Before</div>

  <div class="container">
    <!-- this heading changes depending on the event (see script.js) -->
    <h1 id="eventHeading">Before your big moment</h1>

    <h2>Where do you feel the stress right now?</h2>

    <div class="card-row">
      <button class="card choice" id="bodyBtn">
        <span class="card-emoji">💓</span>
        <strong>In my body</strong>
        <span class="card-text">Racing heart, shaky hands, tight chest</span>
      </button>

      <button class="card choice" id="mindBtn">
        <span class="card-emoji">💭</span>
        <strong>In my mind</strong>
        <span class="card-text">Worried thoughts, "what if I mess up?"</span>
      </button>
    </div>

    <button class="small-btn" id="backHome">Back</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
