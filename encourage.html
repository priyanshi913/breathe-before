<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breathe Before - A reminder for you</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="encourage-bg">

  <div class="logo logo-left">🌿 Breathe Before</div>

  <div class="container">
    <h1>A quick reminder for you</h1>

    <!-- message gets picked randomly in script.js -->
    <div class="card message-card">
      <p id="message">You are more prepared than you think.</p>
    </div>

    <p class="tip">Quick tip: name 3 things you can see around you right now. It helps bring your mind back to the present.</p>

    <button class="small-btn" id="anotherBtn">Show me another</button>
    <button class="big-btn" id="readyBtn">I'm ready</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
